name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

# Set permissions for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Applications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            prover/package-lock.json
            verifier-ui/package-lock.json

      - name: Install prover dependencies
        working-directory: ./prover
        run: npm ci

      - name: Install verifier-ui dependencies
        working-directory: ./verifier-ui
        run: npm ci

      - name: Build prover
        working-directory: ./prover
        env:
          NODE_ENV: production
        run: npm run build

      - name: Build verifier-ui
        working-directory: ./verifier-ui
        env:
          NODE_ENV: production
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Merge build artifacts
        run: |
          mkdir -p ./dist
          # Copy prover build output
          cp -r ./prover/out ./dist/prover
          # Copy verifier-ui build output
          cp -r ./verifier-ui/out ./dist/verifier
          # Create index.html for root (optional redirect page)
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Tri-CertFramework</title><meta http-equiv="refresh" content="0; url=./prover/"></head><body><p><a href="./prover/">Prover</a> | <a href="./verifier/">Verifier</a></p></body></html>' > ./dist/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

