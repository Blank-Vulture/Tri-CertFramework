name: Deploy to GitHub Pages

on:
  # mainブランチへのpushでトリガー
  push:
    branches:
      - main
  # 手動実行も可能
  workflow_dispatch:
  # PRのマージ時にも実行（オプション）
  pull_request:
    branches:
      - main

# GitHub Pagesデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を1つに制限（デプロイ競合を回避）
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            docs/package-lock.json
            prover/package-lock.json
            verifier-ui/package-lock.json

      - name: Install dependencies (Docs)
        working-directory: ./docs
        run: npm ci

      - name: Install dependencies (Prover)
        working-directory: ./prover
        run: npm ci

      - name: Install dependencies (Verifier UI)
        working-directory: ./verifier-ui
        run: npm ci

      - name: Build Prover (Static Export)
        working-directory: ./prover
        run: npm run build:export
        env:
          NEXT_EXPORT: "true"
          BASE_PATH: "/Tri-CertFramework/prover"
          ASSET_PREFIX: "/Tri-CertFramework/prover"
          NEXT_PUBLIC_BASE_PATH: "/Tri-CertFramework/prover"

      - name: Build Verifier UI (Static Export)
        working-directory: ./verifier-ui
        run: npm run build:export
        env:
          NEXT_EXPORT: "true"
          BASE_PATH: "/Tri-CertFramework/verifier-ui"
          ASSET_PREFIX: "/Tri-CertFramework/verifier-ui"
          NEXT_PUBLIC_BASE_PATH: "/Tri-CertFramework/verifier-ui"

      - name: Build Docs (Astro)
        working-directory: ./docs
        run: npm run build

      - name: Create deployment directory
        run: |
          mkdir -p deploy/dist
          mkdir -p deploy/dist/prover
          mkdir -p deploy/dist/verifier-ui

      - name: Copy Docs build output (root)
        run: |
          cp -r docs/dist/* deploy/dist/

      - name: Copy Prover build output
        run: |
          cp -r prover/out/* deploy/dist/prover/

      - name: Copy Verifier UI build output
        run: |
          cp -r verifier-ui/out/* deploy/dist/verifier-ui/

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './deploy/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

